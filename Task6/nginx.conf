# Конфигурация Nginx с ограничением частоты запросов (Rate Limiting).
# Требование: не более 10 запросов в минуту, при превышении - HTTP 429.

events {}

http {
    # Ключ лимитирования - партнер.
    # Известные API-ключи партнеров сопоставляются с идентификатором партнера,
    # поэтому лимит считается на партнера независимо от числа его IP-адресов.
    # Запросы без ключа или с неизвестным ключом лимитируются по IP клиента:
    # подставить случайный ключ и получить "новый" лимит не получится.
    # Список ключей в реальной среде генерируется из хранилища секретов
    # (include /etc/nginx/partners.map), здесь - пример.
    map $http_x_api_key $limit_key {
        default                 $binary_remote_addr;
        "partner-a-secret-key"  "partner-a";
        "partner-b-secret-key"  "partner-b";
    }

    # Зона api_limit: 10 МБ общей памяти (~160 000 ключей),
    # скорость 10 запросов в минуту.
    # Nginx реализует leaky bucket: 10r/m = 1 запрос каждые 6 секунд.
    limit_req_zone $limit_key zone=api_limit:10m rate=10r/m;

    # Код ответа при превышении лимита (по умолчанию 503).
    limit_req_status 429;

    # Уровень логирования отклоненных запросов.
    limit_req_log_level warn;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # burst не задан намеренно: запросы, пришедшие чаще чем раз в 6 секунд,
            # сразу отклоняются с кодом 429. Это гарантирует не более 10 запросов
            # в любом 60-секундном окне. Вариант "burst=9 nodelay" пропустил бы
            # 10 запросов сразу, но тогда в окне 60 секунд могло бы пройти до 19.
            limit_req zone=api_limit;

            proxy_pass http://backend_servers;
        }

        # Тело ответа для 429 с подсказкой, когда повторить запрос.
        error_page 429 = @too_many_requests;

        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 6 always;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded: 10 requests per minute"}';
        }
    }
}
